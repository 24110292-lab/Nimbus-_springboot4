<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JWT Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5" style="min-height: 500px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Spring Boot REST API with AJAX</h2>
        <button id="logout" class="btn btn-outline-danger">Logout</button>
    </div>
    <div id="feedback" class="alert alert-danger d-none"></div>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Authenticated user</h5>
            <p class="mb-1"><strong>Full name:</strong> <span id="profile"></span></p>
            <p class="mb-1"><strong>Email:</strong> <span id="emailProfile"></span></p>
            <img id="images" src="" alt="User image" class="img-thumbnail mt-3 d-none" style="max-width: 180px;">
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
